<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tic-tac-toe</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #111111;
      --elevated: #1A1A1A;
      --border: #262626;
      --border-strong: #333333;
      --text: #EDEDED;
      --text-dim: #A1A1A1;
      --text-muted: #707070;
      --accent: #EDEDED;
      --accent-fg: #0A0A0A;
      --danger: #F84E4E;
      --success: #4ADE80;
      --warning: #FBBF24;
      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 10px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      /* mark colours stay distinct but tuned to the new palette */
      --x: #F472B6;
      --o: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      font-feature-settings: "cv11", "ss01", "tnum";
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }
    body { display: flex; flex-direction: column; }

    button {
      background: var(--elevated); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: background 0.1s ease, border-color 0.1s ease;
    }
    button:hover { background: var(--border); border-color: var(--border-strong); }
    button:active { background: var(--border-strong); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.primary:hover { filter: brightness(1.12); }
    button.danger { background: var(--danger); border-color: var(--danger); color: white; }
    button.danger:hover { filter: brightness(1.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    input, select, textarea {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.1s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }

    code, pre { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 6px; font-size: 12px; }
    pre { padding: var(--space-3); overflow-x: auto; }
    hr { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }
    h1, h2, h3 { font-weight: 600; margin: 0 0 var(--space-3); letter-spacing: -0.01em; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--text-dim); }
    .dim { color: var(--text-muted); }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    header h1 { font-size: 14px; color: var(--text); letter-spacing: 0.02em; margin: 0; }
    .hint { font-size: 11px; color: var(--text-dim); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: var(--elevated); border: 1px solid var(--border); font-size: 11px;
      color: var(--text-dim);
    }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .pill.ok .dot { background: var(--success); }
    .pill.warn .dot { background: var(--warning); }
    .pill.err .dot { background: var(--danger); }

    main {
      flex: 1; padding: 18px; overflow: auto;
      display: grid; gap: 16px;
      grid-template-columns: minmax(280px, 360px) 1fr;
      max-width: 880px; width: 100%; margin: 0 auto;
    }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-dim); margin-bottom: 10px; font-weight: 600;
    }

    .board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: var(--bg); padding: 8px; border-radius: var(--radius);
      aspect-ratio: 1;
      max-width: 280px;
      border: 1px solid var(--border);
    }
    .cell {
      background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font: 700 38px/1 var(--font-sans);
      cursor: pointer; user-select: none;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
      position: relative;
      min-height: 64px;
      color: var(--text);
    }
    .cell:hover:not(:disabled):not(.taken) { border-color: var(--accent); background: rgba(255,255,255,0.10); }
    .cell:active:not(:disabled) { transform: scale(0.96); }
    .cell.X { color: var(--x); }
    .cell.O { color: var(--o); }
    .cell.taken { cursor: not-allowed; }
    .cell.win { background: rgba(74,222,128,0.14); border-color: rgba(74,222,128,0.5); }
    .cell .num {
      position: absolute; top: 4px; left: 6px;
      font-size: 11px; color: var(--text-dim); font-weight: 400;
    }
    .cell:not(.taken):not(.win) .num { color: var(--text-muted); opacity: 0.6; }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .narration {
      max-height: 360px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }
    .narration .line {
      padding: 6px 10px; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 12px; line-height: 1.45; white-space: pre-wrap;
    }
    .narration .line pre {
      background: var(--bg); padding: 4px 6px; border-radius: 3px;
      font: 11px var(--font-mono); display: inline-block; margin: 4px 0;
      border: 1px solid var(--border);
    }
    .narration .empty { color: var(--text-dim); font-style: italic; font-size: 12px; padding: 8px 0; }
    .narration code { background: var(--bg); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); }
    .turn-banner { font-weight: 600; font-size: 13px; color: var(--text); }
    .turn-banner.you { color: var(--success); }
    .turn-banner.them { color: var(--warning); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>tic-tac-toe</h1>
      <div class="hint">You play vs the LLM — click a cell or type 1-9 from any chat surface.</div>
    </div>
    <div class="pill" id="status"><span class="dot"></span><span id="status-text">loading…</span></div>
  </header>

  <main>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div class="card">
        <h2>Board</h2>
        <div class="board" id="board">
          <!-- cells rendered by JS -->
        </div>
        <div class="row" style="margin-top: 10px; justify-content: space-between;">
          <div class="turn-banner" id="turn-banner">idle</div>
          <div class="hint" id="score-hint"></div>
        </div>
      </div>

      <div class="card">
        <h2>Controls</h2>
        <div class="row" style="margin-bottom: 8px;">
          <label class="hint">Play as</label>
          <select id="mark">
            <option value="X">X (you start)</option>
            <option value="O">O (LLM starts)</option>
          </select>
          <button id="start" class="primary">▶ New game</button>
        </div>
        <div class="row">
          <button id="quit" class="danger" disabled>■ Quit</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Narration</h2>
      <div class="narration" id="narration">
        <div class="empty">Start a game — the commentary appears here and on every connected chat surface.</div>
      </div>
    </div>

  </main>

  <script>
    const nodeId = window.location.pathname.split('/nodes/')[1]?.split('/ui')[0];
    const apiBase = window.location.origin;

    const els = {
      status: document.getElementById('status'),
      statusText: document.getElementById('status-text'),
      board: document.getElementById('board'),
      turnBanner: document.getElementById('turn-banner'),
      scoreHint: document.getElementById('score-hint'),
      mark: document.getElementById('mark'),
      start: document.getElementById('start'),
      quit: document.getElementById('quit'),
      narration: document.getElementById('narration'),
    };

    let lastMessageId = null;
    let currentState = null;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function setPill(state, text) {
      els.status.className = `pill ${state}`;
      els.statusText.textContent = text;
    }

    function renderBoard(state) {
      const winSet = new Set(state?.winning_line ?? []);
      els.board.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const mark = state?.board?.[i] ?? null;
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (mark) cell.classList.add(mark, 'taken');
        if (winSet.has(i)) cell.classList.add('win');
        cell.innerHTML = `<span class="num">${i + 1}</span>${mark ?? ''}`;
        cell.addEventListener('click', () => onCellClick(i));
        els.board.appendChild(cell);
      }
    }

    function applyState(state) {
      currentState = state;
      renderBoard(state);
      const playing = state.status === 'playing';
      els.quit.disabled = !playing;
      els.start.disabled = playing;
      els.mark.disabled = playing;

      if (state.status === 'idle') {
        setPill('warn', 'idle — pick a side and start');
        els.turnBanner.textContent = '—';
        els.turnBanner.className = 'turn-banner';
      } else if (playing) {
        const yours = state.turn === state.player;
        setPill('ok', yours ? 'your turn' : `${state.llm} thinking…`);
        els.turnBanner.textContent = yours ? `your turn (${state.player})` : `${state.llm} thinking…`;
        els.turnBanner.className = `turn-banner ${yours ? 'you' : 'them'}`;
      } else if (state.status === 'won') {
        const youWon = state.winner === state.player;
        setPill(youWon ? 'ok' : 'err', youWon ? `you win 🎉 (${state.player})` : `LLM wins 💀 (${state.llm})`);
        els.turnBanner.textContent = youWon ? '🎉 you win!' : '💀 LLM wins';
        els.turnBanner.className = `turn-banner ${youWon ? 'you' : 'them'}`;
      } else if (state.status === 'tie') {
        setPill('warn', 'tie 🤝');
        els.turnBanner.textContent = '🤝 tie';
        els.turnBanner.className = 'turn-banner';
      }
      els.scoreHint.textContent = `move ${state.move_count}/9`;
    }

    function addNarration(text) {
      const empty = els.narration.querySelector('.empty');
      empty?.remove();
      const div = document.createElement('div');
      div.className = 'line';
      // tiny markdown: *bold*, `code`, ```fenced``` blocks
      const fenced = escapeHtml(text)
        .replace(/```\n([\s\S]+?)\n```/g, '<pre>$1</pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
      div.innerHTML = fenced;
      els.narration.appendChild(div);
      els.narration.scrollTop = els.narration.scrollHeight;
      while (els.narration.children.length > 60) els.narration.firstChild.remove();
    }

    async function pollMessages() {
      try {
        const res = await fetch(`${apiBase}/nodes/${nodeId}/ui/messages`);
        if (!res.ok) { setPill('err', 'node not running'); return; }
        const messages = await res.json();
        let startIdx = 0;
        if (lastMessageId) {
          const idx = messages.findIndex((m) => m.id === lastMessageId);
          if (idx >= 0) startIdx = idx + 1;
        }
        for (const msg of messages.slice(startIdx)) {
          handleMessage(msg);
          lastMessageId = msg.id;
        }
      } catch { setPill('err', 'disconnected'); }
    }

    function handleMessage(msg) {
      if (msg.topic === 'game.tictactoe.state') {
        try {
          const data = JSON.parse(msg.payload.content);
          applyState(data);
        } catch { /* malformed */ }
      } else if (msg.topic === 'chat.response' && msg.metadata?.from_game === 'tictactoe') {
        // Narration arrives on chat.response (the game publishes there
        // directly — no brain hop). Filter to our own from_game tag so
        // we don't echo unrelated chat lines.
        addNarration(msg.payload?.content ?? '');
      }
    }

    async function sendCommand(action, extra = {}) {
      try {
        await fetch(`${apiBase}/nodes/${nodeId}/ui/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: 'game.tictactoe.command',
            content: JSON.stringify({ action, ...extra }),
            from: 'system.tictactoe-ui',
            criticality: 4,
            metadata: { action, ...extra },
          }),
        });
      } catch (e) { addNarration(`UI error: ${e.message}`); }
    }

    async function sendCellPick(cell) {
      // The game UI knows its input is unambiguously a move — no NLU
      // needed. Publish straight to the game's command topic. The brain
      // still relays the resulting event to the main chat surface, so
      // the conversation thread sees the move + outcome there too.
      await sendCommand('move', { cell: cell + 1 });
    }

    function onCellClick(i) {
      if (!currentState || currentState.status !== 'playing') return;
      if (currentState.board[i] !== null) return;
      if (currentState.turn !== currentState.player) return;
      sendCellPick(i);
    }

    els.start.addEventListener('click', () => sendCommand('start', { mark: els.mark.value }));
    els.quit.addEventListener('click', () => {
      if (!confirm('Quit the current game?')) return;
      sendCommand('quit');
    });

    pollMessages();
    setInterval(pollMessages, 1200);
    setTimeout(() => sendCommand('status'), 300);
  </script>
</body>
</html>
