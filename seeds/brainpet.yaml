# brainpet — a persistent tamagotchi-style pet driven by its own LLM.
#
# The brain is the network's sole NLU gateway: it reads chat.input,
# decides whether the user is talking to the pet (mention of the name,
# or care verbs like feed / play / cuddle), then forwards on
# brainpet.command with the matching action ({action: "talk", text}
# or {action: "feed"} etc.). Brainpet's own LLM crafts the in-character
# reply on chat.response.
#
# brainpet.state / brainpet.cemetery carry raw JSON for dedicated
# panels — NOT subscribed by the chat to avoid dumping state objects
# into the chat surface.

nodes:
  - type: chat
    name: human
    description: "Chat UI — talk to the pet, see it react."
    priority: 5
    position: { x: 50, y: 300 }
    # chat keeps its default subscriptions (chat.response,
    # chat.response.*, chat.input). brainpet.state / brainpet.cemetery
    # stay out on purpose.

  - type: brain
    name: consciousness
    description: "NLU gateway. Routes user chat to brainpet.command."
    priority: 10
    position: { x: 400, y: 300 }
    subscriptions:
      - topic: "chat.input"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      max_steps: 4

  - type: brainpet
    name: pet
    description: "Persistent virtual pet. Drives its own LLM, decays stats, can die."
    priority: 4
    position: { x: 750, y: 300 }
