# hangman — play hangman against the LLM through chat.
#
# Topology (brain is in the FORWARD path only — backward goes direct):
#
#   chat ──chat.input──▶ brain ──game.hangman.command──▶ hangman
#                                                       hangman ──chat.response──▶ chat
#
# Forward path: say "let's play hangman" → the brain publishes
# {"action":"start"} on game.hangman.command, hangman starts a round.
# Each letter typed in the main chat is forwarded by the brain as
# {"action":"guess","value":"a"} on the same command channel. The
# hangman UI's own input field publishes directly to game.hangman.command
# (no brain hop — the UI context already disambiguates the input).
#
# Reverse path: hangman publishes narration straight to chat.response
# (tagged metadata.from_game="hangman"). The brain is NOT in the loop
# here — every chat surface (web UI, bridges, the hangman UI itself)
# subscribes to chat.response and renders the line. State snapshots
# stay on game.hangman.state for monitoring panels and the game UI.

nodes:
  - type: chat
    name: human
    description: "Chat UI — say 'let's play hangman' to start, then type letters."
    priority: 5
    position: { x: 50, y: 300 }

  - type: brain
    name: consciousness
    description: "NLU gateway. Routes user input to the right command tool. Does NOT relay game events — games publish to chat.response directly."
    priority: 10
    position: { x: 400, y: 300 }
    subscriptions:
      - topic: "chat.input"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      max_steps: 4

  - type: hangman
    name: hangman
    description: "Hangman game. Picks words, scores guesses, narrates directly on chat.response."
    priority: 4
    position: { x: 750, y: 300 }
