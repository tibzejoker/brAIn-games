# tictactoe — play morpion against the LLM through chat.
#
# Topology (brain is in the FORWARD path only — backward goes direct):
#
#   chat ──chat.input──▶ brain ──game.tictactoe.command──▶ tictactoe
#                                                          tictactoe ──chat.response──▶ chat
#
# Forward path: say "play tictactoe" → brain publishes
# {"action":"start"} on game.tictactoe.command. Cells typed in the main
# chat (1-9 numpad) are forwarded as {"action":"move","cell":5}. The
# tictactoe UI's own cell clicks publish directly to game.tictactoe.command
# (no brain hop).
#
# Reverse path: tictactoe publishes narration straight to chat.response
# (tagged metadata.from_game="tictactoe"). The brain is NOT in the loop
# here — every chat surface renders the line directly. State snapshots
# stay on game.tictactoe.state for monitoring panels and the game UI.

nodes:
  - type: chat
    name: human
    description: "Chat UI — say 'play tictactoe' to start, then type a digit 1-9 to move."
    priority: 5
    position: { x: 50, y: 300 }

  - type: brain
    name: consciousness
    description: "NLU gateway. Routes user input to the right command tool. Does NOT relay game events — games publish to chat.response directly."
    priority: 10
    position: { x: 400, y: 300 }
    subscriptions:
      - topic: "chat.input"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      max_steps: 4

  - type: tictactoe
    name: tictactoe
    description: "Tic-tac-toe game. Human plays X, the LLM plays O. Narrates events directly on chat.response."
    priority: 4
    position: { x: 750, y: 300 }
